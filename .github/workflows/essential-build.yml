name: "godot-ci export"
on:
  push:
    tags:
    - 'zfd-v*'

jobs:
  build_windows:
    permissions:
      contents: write
    name: Windows Export
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: .NET installation
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x
      
      - name: Windows Build
        run: |
          scons platform=windows target=editor module_mono_enabled=yes
          scons platform=windows target=template_debug module_mono_enabled=yes
          scons platform=windows target=template_release module_mono_enabled=yes
          bin/godot.windows.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows
          zip -r "../zerofkndevs-godot.zip" ./bin/*
      
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/zerofkndevs-godot.zip