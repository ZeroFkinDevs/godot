name: "Essential Build"
on:
  push:
    tags:
    - 'zfd-v*'

jobs:

  build_linux:
    permissions:
      contents: write
    name: Linux Export
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: .NET installation
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup GCC problem matcher
        uses: ammaraskar/gcc-problem-matcher@master
      
      - name: Linux Build
        run: |
          scons platform=linuxbsd target=editor module_mono_enabled=yes
          # scons platform=linuxbsd target=template_release module_mono_enabled=yes
          bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd
          cd bin
          zip -r "../zerofkndevs-godot-linux.zip" *

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zerofkndevs-godot-linux.zip

  build_windows:
    permissions:
      contents: write
    name: Windows Export
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: .NET installation
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6029
          file: Windows.6029-1.MSVC_17.x86_64.x86_32.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{github.workspace}}/

      - name: Setup MSVC problem matcher
        uses: ammaraskar/msvc-problem-matcher@master
      
      - name: Windows Build
        run: |
          scons platform=windows target=editor module_mono_enabled=yes
          scons platform=windows target=template_release module_mono_enabled=yes
          bin/godot.windows.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=windows
          Compress-Archive -Path bin/* -Destination zerofkndevs-godot-windows.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zerofkndevs-godot-windows.zip
